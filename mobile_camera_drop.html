<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JC Capture - Terminal Móvil Clínico</title>
    <!-- SDK de Supabase Realtime -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #0f172a;
            --border: #1e293b;
            --primary: #0284c7;
            --accent-orden: #8b5cf6;
            --accent-macro: #0ea5e9;
            --accent-360: #10b981;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg); color: var(--text);
            min-height: 100vh; min-height: -webkit-fill-available;
            display: flex; flex-direction: column; overflow-x: hidden;
        }
        .header {
            padding: 12px 16px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            font-weight: 800; font-size: 1.05rem; color: #38bdf8;
        }
        .lan-pill {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75rem; font-weight: 700; color: var(--success);
            background: rgba(16, 185, 129, 0.15); padding: 4px 10px;
            border-radius: 9999px; border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .pulse-dot {
            width: 8px; height: 8px; background: var(--success);
            border-radius: 50%; box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        /* Destino prefijado por QR (Poka-Yoke) */
        .locked-banner {
            display: none;
            padding: 14px 16px;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.6px;
            border-bottom: 2px solid var(--border);
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        .locked-banner.mode-orden {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(147, 51, 234, 0.15));
            border-bottom-color: var(--accent-orden);
            color: #c084fc;
        }
        .locked-banner.mode-macro {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.3), rgba(14, 165, 233, 0.15));
            border-bottom-color: var(--accent-macro);
            color: #38bdf8;
        }
        .locked-banner.mode-macro360 {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.3), rgba(16, 185, 129, 0.15));
            border-bottom-color: var(--accent-360);
            color: #34d399;
        }

        /* Selector manual si no viene prefijado */
        .mode-selector {
            padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr 1fr;
            background: #0b1329; gap: 6px; border-bottom: 1px solid var(--border);
        }
        .mode-btn {
            background: transparent; border: none; color: var(--muted);
            padding: 8px 4px; border-radius: 8px; font-size: 0.74rem; font-weight: 700;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; transition: all 0.2s;
        }
        .mode-btn.active {
            background: #1e293b; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .mode-btn.active[data-mode="orden"] { border-bottom: 2px solid var(--accent-orden); color: #c084fc; }
        .mode-btn.active[data-mode="macro"] { border-bottom: 2px solid var(--accent-macro); color: #38bdf8; }
        .mode-btn.active[data-mode="macro360"] { border-bottom: 2px solid var(--accent-360); color: #34d399; }

        .viewport {
            flex: 1; margin: 12px 14px; position: relative; background: #020617;
            border-radius: 16px; border: 1.5px solid var(--border); overflow: hidden;
            display: flex; align-items: center; justify-content: center; min-height: 260px;
        }
        .preview-media {
            width: 100%; height: 100%; object-fit: contain; display: none;
        }
        .guide-box {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 20px; color: var(--muted); pointer-events: none;
        }
        .guide-reticle {
            width: 110px; height: 110px; border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
        }
        .guide-reticle::after { content: "+"; font-size: 26px; color: rgba(56, 189, 248, 0.5); }

        .info-hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: none; justify-content: space-between; align-items: center; z-index: 10;
        }
        .hud-chip {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
            padding: 3px 8px; font-size: 0.72rem; font-weight: 700;
        }

        .transfer-overlay {
            position: absolute; inset: 0; background: rgba(3, 7, 18, 0.94);
            backdrop-filter: blur(8px); display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; z-index: 25; text-align: center;
        }
        .spinner {
            width: 46px; height: 46px; border: 4px solid rgba(14, 165, 233, 0.2);
            border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .dock {
            padding: 12px 14px calc(var(--safe-bottom) + 6px); background: var(--card);
            border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
        }
        .btn-shoot {
            width: 100%; height: 60px; border-radius: 14px; border: none; font-size: 1.02rem;
            font-weight: 800; color: white; display: flex; align-items: center; justify-content: center;
            gap: 10px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .btn-shoot:active { transform: scale(0.98); }
        .theme-orden { background: linear-gradient(135deg, #7c3aed, #9333ea); }
        .theme-macro { background: linear-gradient(135deg, #0284c7, #0369a1); }
        .theme-macro360 { background: linear-gradient(135deg, #059669, #10b981); }

        .review-dock {
            display: none; grid-template-columns: 1fr 1.6fr; gap: 10px; width: 100%;
        }
        .btn-repeat {
            height: 56px; border-radius: 12px; border: 1.5px solid rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.12); color: #fca5a5; font-size: 0.92rem;
            font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        .btn-send {
            height: 56px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 0.98rem;
            font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); cursor: pointer;
        }
        .btn-repeat:active, .btn-send:active { transform: scale(0.98); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <input type="file" id="cameraPhotoInput" accept="image/*" capture="environment">
    <input type="file" id="cameraVideoInput" accept="video/*" capture="environment">

    <header class="header">
        <div class="brand">
            <span>📷</span> <span>JC PATH MOBILE</span>
        </div>
        <div class="lan-pill">
            <span class="pulse-dot"></span>
            <span id="netStatusText">REALTIME ACTIVO</span>
        </div>
    </header>

    <!-- Poka-Yoke: Destino prefijado inmutable -->
    <div id="lockedBanner" class="locked-banner">
        <span id="lockedBannerText">📄 CAPTURA DE ORDEN MÉDICA</span>
    </div>

    <!-- Selector manual alternativo (solo si no viene prefijado) -->
    <nav class="mode-selector" id="modeSelector">
        <button class="mode-btn" data-mode="orden" onclick="setMode('orden')">
            <span style="font-size:1.1rem;">📄</span>
            <span>Orden Med.</span>
        </button>
        <button class="mode-btn" data-mode="macro" onclick="setMode('macro')">
            <span style="font-size:1.1rem;">🔬</span>
            <span>Macro Fija</span>
        </button>
        <button class="mode-btn" data-mode="macro360" onclick="setMode('macro360')">
            <span style="font-size:1.1rem;">🔄</span>
            <span>Giro 360°</span>
        </button>
    </nav>

    <main class="viewport">
        <div class="info-hud" id="infoHud">
            <div class="hud-chip" id="hudResolution">1920x1080</div>
            <div class="hud-chip" style="color: #34d399;" id="hudSize">0.0 MB</div>
        </div>

        <img id="imagePreview" class="preview-media" alt="Previsualización">
        <video id="videoPreview" class="preview-media" playsinline controls autoplay muted loop></video>

        <div class="guide-box" id="guideBox">
            <div class="guide-reticle"></div>
            <p id="guideInstruction" style="font-size: 0.85rem; font-weight: 600;">Alinee el documento médico dentro del recuadro</p>
            <span style="font-size: 0.72rem; margin-top: 4px; color: #64748b;">Dispare la cámara con el botón inferior</span>
        </div>

        <div class="transfer-overlay" id="transferOverlay">
            <div class="spinner" id="transferSpinner"></div>
            <div id="transferDoneIcon" style="font-size: 2.6rem; display: none; margin-bottom: 10px;">✅</div>
            <h3 id="transferTitle" style="font-size: 1.1rem; font-weight: 800;">Transfiriendo a la PC...</h3>
            <p id="transferSubtitle" style="font-size: 0.78rem; color: var(--muted); margin-top: 4px;">
                Cero almacenamiento en celular · Transmisión Realtime
            </p>
        </div>
    </main>

    <footer class="dock">
        <button id="btnMainShoot" class="btn-shoot theme-orden" onclick="triggerCamera()">
            <span id="btnShootIcon" style="font-size: 1.3rem;">📄</span>
            <span id="btnShootLabel">Tomar Foto de Orden Médica</span>
        </button>

        <div class="review-dock" id="reviewDock">
            <button class="btn-repeat" onclick="repeatShot()">
                <span>🔄</span> <span>Repetir</span>
            </button>
            <button class="btn-send" onclick="sendToPc()">
                <span>⚡</span> <span>Enviar a PC</span>
            </button>
        </div>
    </footer>

    <script>
        // Configuración Supabase
        const SUPABASE_URL = 'https://yyylfrnynlgwaxxocixa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Xlrt1FyJMNxL-XIap15MOA_YOkDe4dK';

        // Inicialización cliente Supabase
        if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // Parámetros URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionToken = urlParams.get('token') || 'tok_anon';
        const targetParam = urlParams.get('target') || 'orden';
        const rawModeParam = urlParams.get('mode');

        // Detección de modo y estado prefijado (Poka-Yoke)
        let isLocked = false;
        let currentMode = 'orden';

        if (rawModeParam) {
            isLocked = true;
            if (rawModeParam === 'macro360' || rawModeParam === '360') currentMode = 'macro360';
            else if (rawModeParam === 'macro') currentMode = 'macro';
            else currentMode = 'orden';
        } else if (urlParams.has('target')) {
            isLocked = true;
            if (targetParam.includes('360')) currentMode = 'macro360';
            else if (targetParam.includes('macro')) currentMode = 'macro';
            else currentMode = 'orden';
        } else {
            isLocked = false;
            currentMode = 'orden';
        }

        let currentFile = null;
        let currentBlobUrl = null;

        // Referencias DOM
        const photoInput = document.getElementById('cameraPhotoInput');
        const videoInput = document.getElementById('cameraVideoInput');
        const imagePreview = document.getElementById('imagePreview');
        const videoPreview = document.getElementById('videoPreview');
        const guideBox = document.getElementById('guideBox');
        const btnMainShoot = document.getElementById('btnMainShoot');
        const reviewDock = document.getElementById('reviewDock');
        const btnShootIcon = document.getElementById('btnShootIcon');
        const btnShootLabel = document.getElementById('btnShootLabel');
        const guideInstruction = document.getElementById('guideInstruction');
        const infoHud = document.getElementById('infoHud');
        const hudResolution = document.getElementById('hudResolution');
        const hudSize = document.getElementById('hudSize');
        const transferOverlay = document.getElementById('transferOverlay');
        const transferSpinner = document.getElementById('transferSpinner');
        const transferDoneIcon = document.getElementById('transferDoneIcon');
        const transferTitle = document.getElementById('transferTitle');
        const transferSubtitle = document.getElementById('transferSubtitle');
        const lockedBanner = document.getElementById('lockedBanner');
        const lockedBannerText = document.getElementById('lockedBannerText');
        const modeSelector = document.getElementById('modeSelector');

        window.addEventListener('DOMContentLoaded', () => {
            applyModeUI(currentMode, isLocked);

            photoInput.addEventListener('change', (e) => onMediaCaptured(e.target.files[0]));
            videoInput.addEventListener('change', (e) => onMediaCaptured(e.target.files[0]));
        });

        function applyModeUI(mode, locked) {
            currentMode = mode;

            if (locked) {
                modeSelector.style.display = 'none';
                lockedBanner.style.display = 'flex';
                lockedBanner.className = 'locked-banner mode-' + mode;

                if (mode === 'orden') {
                    lockedBannerText.innerText = '📄 CAPTURA DE ORDEN MÉDICA';
                } else if (mode === 'macro') {
                    lockedBannerText.innerText = '🔬 FOTO DE MACROSCOPÍA';
                } else if (mode === 'macro360') {
                    lockedBannerText.innerText = '🔄 VIDEO MACRO 360°';
                }
            } else {
                lockedBanner.style.display = 'none';
                modeSelector.style.display = 'grid';
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-mode') === mode);
                });
            }

            btnMainShoot.className = 'btn-shoot';
            if (mode === 'orden') {
                btnMainShoot.classList.add('theme-orden');
                btnShootIcon.innerText = '📄';
                btnShootLabel.innerText = 'Tomar Foto de Orden Médica';
                guideInstruction.innerText = 'Alinee el documento médico dentro del recuadro';
            } else if (mode === 'macro') {
                btnMainShoot.classList.add('theme-macro');
                btnShootIcon.innerText = '🔬';
                btnShootLabel.innerText = 'Tomar Foto Macroscópica';
                guideInstruction.innerText = 'Centre la pieza quirúrgica con buena luz';
            } else if (mode === 'macro360') {
                btnMainShoot.classList.add('theme-macro360');
                btnShootIcon.innerText = '🔄';
                btnShootLabel.innerText = 'Grabar Giro 360° (~10 seg)';
                guideInstruction.innerText = 'Gire suavemente la pieza o camine alrededor';
            }
        }

        function setMode(mode) {
            if (navigator.vibrate) navigator.vibrate(20);
            applyModeUI(mode, false);
            resetToIdle();
        }

        function triggerCamera() {
            if (navigator.vibrate) navigator.vibrate(30);
            if (currentMode === 'macro360') {
                videoInput.click();
            } else {
                photoInput.click();
            }
        }

        function onMediaCaptured(file) {
            if (!file) return;

            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }

            currentFile = file;
            currentBlobUrl = URL.createObjectURL(file);

            guideBox.style.display = 'none';
            infoHud.style.display = 'flex';
            hudSize.innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;

            if (file.type.startsWith('video/')) {
                imagePreview.style.display = 'none';
                videoPreview.style.display = 'block';
                videoPreview.src = currentBlobUrl;
                hudResolution.innerText = 'VIDEO 360°';
            } else {
                videoPreview.style.display = 'none';
                imagePreview.style.display = 'block';
                imagePreview.src = currentBlobUrl;
                imagePreview.onload = () => {
                    hudResolution.innerText = `${imagePreview.naturalWidth} x ${imagePreview.naturalHeight}`;
                };
            }

            btnMainShoot.style.display = 'none';
            reviewDock.style.display = 'grid';
        }

        function repeatShot() {
            if (navigator.vibrate) navigator.vibrate(25);
            resetToIdle();
            triggerCamera();
        }

        function resetToIdle() {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
            currentFile = null;
            photoInput.value = '';
            videoInput.value = '';
            imagePreview.style.display = 'none';
            imagePreview.src = '';
            videoPreview.style.display = 'none';
            videoPreview.src = '';
            guideBox.style.display = 'flex';
            infoHud.style.display = 'none';
            reviewDock.style.display = 'none';
            btnMainShoot.style.display = 'flex';
        }

        // Compresión ultra-eficiente en Canvas a WebP: legible al ojo humano y peso pluma (< 80KB)
        function compressImageToWebP(file, maxWidth = 1200, maxHeight = 900, quality = 0.60) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const tempUrl = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(tempUrl);
                    let width = img.naturalWidth || img.width;
                    let height = img.naturalHeight || img.height;

                    // Escalar a resolución óptima de lectura clínica (máx 1200px)
                    if (width > maxWidth || height > maxHeight) {
                        const ratio = Math.min(maxWidth / width, maxHeight / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    // Suavizado bicúbico para evitar pérdida de trazos en texto médico
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);

                    let mime = 'image/webp';
                    let dataUrl = canvas.toDataURL('image/webp', quality);
                    if (!dataUrl.startsWith('data:image/webp')) {
                        mime = 'image/jpeg';
                        dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                    }

                    // Si aún superase los 90KB (aprox 120,000 caracteres base64), ajuste fino secundario
                    if (dataUrl.length > 120000) {
                        const canvas2 = document.createElement('canvas');
                        const scale = 0.85;
                        canvas2.width = Math.round(width * scale);
                        canvas2.height = Math.round(height * scale);
                        const ctx2 = canvas2.getContext('2d');
                        ctx2.imageSmoothingEnabled = true;
                        ctx2.imageSmoothingQuality = 'medium';
                        ctx2.drawImage(canvas, 0, 0, canvas2.width, canvas2.height);
                        dataUrl = canvas2.toDataURL(mime, 0.52);
                    }

                    resolve({ dataUrl, mime });
                };

                img.onerror = (err) => {
                    URL.revokeObjectURL(tempUrl);
                    reject(err);
                };

                img.src = tempUrl;
            });
        }

        async function sendToPc() {
            if (!currentFile) return;
            if (navigator.vibrate) navigator.vibrate(40);

            transferOverlay.style.display = 'flex';
            transferSpinner.style.display = 'block';
            transferDoneIcon.style.display = 'none';
            transferTitle.innerText = "Transfiriendo a la PC...";
            transferSubtitle.innerText = "Comprimiendo imagen...";

            try {
                let compressedDataUrl = '';
                let finalMime = currentFile.type || 'image/jpeg';
                let finalFilename = currentFile.name || 'captura_celular.jpg';

                if (currentFile.type.startsWith('video/')) {
                    transferSubtitle.innerText = "Preparando video para envío...";
                    compressedDataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(currentFile);
                    });
                    finalMime = currentFile.type || 'video/mp4';
                    finalFilename = currentFile.name || 'video_macro360.mp4';
                } else {
                    transferSubtitle.innerText = "Optimizando imagen (< 200KB)...";
                    const comp = await compressImageToWebP(currentFile, 1600, 1200, 0.78);
                    compressedDataUrl = comp.dataUrl;
                    finalMime = comp.mime;
                    const ext = finalMime === 'image/webp' ? '.webp' : '.jpg';
                    finalFilename = (currentFile.name || 'captura_celular').replace(/\.[^/.]+$/, "") + ext;
                }

                transferSubtitle.innerText = "Transmitiendo vía Supabase Realtime...";

                // Inicializar cliente Supabase si aún no estuviera instanciado
                const client = (window.supabaseClient) || (window.supabase && window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
                if (!client) {
                    throw new Error("No se pudo iniciar el SDK de Supabase");
                }
                window.supabaseClient = client;

                const channel = client.channel('jc-capture-' + sessionToken, {
                    config: { broadcast: { self: false } }
                });

                // Esperar a que el canal se suscriba
                await new Promise((resolve) => {
                    let connected = false;
                    channel.subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            if (!connected) { connected = true; resolve(); }
                        }
                    });
                    setTimeout(() => {
                        if (!connected) { connected = true; resolve(); }
                    }, 500);
                });

                // Envío directo Broadcast
                await channel.send({
                    type: 'broadcast',
                    event: 'capture',
                    payload: {
                        token: sessionToken,
                        target: targetParam,
                        mode: currentMode,
                        filename: finalFilename,
                        mime: finalMime,
                        dataUrl: compressedDataUrl
                    }
                });

                setTimeout(() => {
                    try { channel.unsubscribe(); } catch(e) {}
                }, 1500);

                if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
                transferSpinner.style.display = 'none';
                transferDoneIcon.innerText = '✅';
                transferDoneIcon.style.display = 'block';
                transferTitle.innerText = "¡Recibido en PC con éxito!";
                transferSubtitle.innerText = "Transferencia instantánea completada";

                setTimeout(() => {
                    transferOverlay.style.display = 'none';
                    resetToIdle();
                }, 2000);

            } catch (err) {
                console.error("Error al transmitir captura:", err);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                transferSpinner.style.display = 'none';
                transferDoneIcon.innerText = '❌';
                transferDoneIcon.style.display = 'block';
                transferTitle.innerText = "Error al enviar";
                transferSubtitle.innerText = err.message || "Fallo en la conexión Realtime";
                setTimeout(() => {
                    transferOverlay.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
