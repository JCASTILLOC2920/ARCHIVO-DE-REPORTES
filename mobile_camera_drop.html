<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Móvil – JCPATHLAB</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #38bdf8;
            --accent-emerald: #10b981;
            --text-muted: #94a3b8;
            --text-primary: #e2e8f0;
        }
        body,html{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg-primary);color:var(--text-primary);}
        header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg-secondary);border-bottom:1px solid #334155;}
        .logo-title{font-weight:700;font-size:1.1rem;}
        .status-badge{display:flex;align-items:center;gap:6px;font-size:0.9rem;}
        .status-dot{width:10px;height:10px;border-radius:50%;background:#fbbf24;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
        main{display:flex;flex-direction:column;align-items:center;padding:16px;gap:20px;}
        .viewfinder-container{position:relative;width:100%;max-width:480px;height:0;padding-bottom:66.66%;background:#1e293b;border-radius:12px;overflow:hidden;}
        video, #previewContainer{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
        #previewContainer{display:none;justify-content:center;align-items:center;background:#1e293b;}
        #previewImage{max-width:100%;max-height:100%;border-radius:8px;}
        .overlay-guide{position:absolute;top:0;left:0;width:100%;height:100%;border:4px dashed var(--accent-blue);box-sizing:border-box;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.2);}
        .guide-text{color:#fff;font-size:0.9rem;text-align:center;padding:8px;background:rgba(0,0,0,0.5);border-radius:6px;}
        .controls-area{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;}
        .btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:background 0.2s;}
        .btn-primary{background:var(--accent-blue);color:#fff;}
        .btn-primary:hover{background:#0ea5e9;}
        .btn-secondary{background:#334155;color:#e2e8f0;}
        .btn-secondary:hover{background:#475569;}
        .fallback-notice{font-size:0.85rem;color:var(--text-muted);text-align:center;}
        #successScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;gap:20px;padding:20px;box-sizing:border-box;}
        .success-icon{font-size:3rem;}
        .success-title{font-size:1.5rem;font-weight:700;color:var(--accent-emerald);}
        .success-desc{font-size:0.95rem;color:var(--text-muted);text-align:center;max-width:300px;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo-title">JCPATHLAB • Móvil</div>
        <div class="status-badge" id="statusBadge">
            <div class="status-dot"></div>
            <span id="statusText">Conectando...</span>
        </div>
    </header>

    <main>
        <div class="viewfinder-container" id="viewfinder">
            <video id="videoPreview" autoplay playsinline muted></video>
            <div id="previewContainer">
                <img id="previewImage" alt="Vista previa de orden">
            </div>
            <div class="overlay-guide" id="overlayGuide">
                <span class="guide-text">Alinee la orden médica dentro del recuadro</span>
            </div>
        </div>

        <div class="controls-area">
            <div id="shootingControls">
                <div id="modePillContainer" style="display:flex;gap:8px;margin-bottom:12px;width:100%;">
                    <button type="button" id="btnModeOrden" class="mode-pill active" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #38bdf8;background:rgba(56,189,248,0.25);color:#38bdf8;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all 0.2s;">
                        📄 Orden / Hoja
                    </button>
                    <button type="button" id="btnModeFrasco" class="mode-pill" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #475569;background:#1e293b;color:#94a3b8;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all 0.2s;">
                        🧪 Frasco (IA 27B)
                    </button>
                </div>
                <button class="btn btn-primary" id="btnCapture">📸 TOMAR FOTO DE LA ORDEN</button>
                <div class="fallback-notice">
                    ¿La cámara en vivo falla? <a href="#" id="lnkNative" style="color:var(--accent-blue);">Usar cámara nativa del sistema</a>
                </div>
            </div>

            <div id="reviewControls" style="display:none;flex-direction:column;gap:10px;">
                <button class="btn btn-primary" id="btnSend">⚡ ENVIAR A LA COMPUTADORA</button>
                <button class="btn btn-secondary" id="btnRetake">🔄 REPETIR FOTO</button>
            </div>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </main>

    <div id="successScreen">
        <div class="success-icon">🎉</div>
        <div class="success-title">¡Orden médica enviada con éxito a la PC!</div>
        <div class="success-desc">La imagen ha sido sincronizada en tiempo real con el sistema clínico. Puede cerrar esta ventana o tomar otra fotografía.</div>
        <button class="btn btn-primary" id="btnAnother">📸 Tomar otra foto</button>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || 'default-token';
            const mode = params.get('mode') || 'auto';
            const target = params.get('target') || 'macro';

            const statusText = document.getElementById('statusText');
            const videoEl = document.getElementById('videoPreview');
            const cameraInput = document.getElementById('cameraInput');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const shootingControls = document.getElementById('shootingControls');
            const reviewControls = document.getElementById('reviewControls');
            const btnCapture = document.getElementById('btnCapture');
            const btnSend = document.getElementById('btnSend');
            const btnRetake = document.getElementById('btnRetake');
            const lnkNative = document.getElementById('lnkNative');
            const successScreen = document.getElementById('successScreen');
            const btnAnother = document.getElementById('btnAnother');
            const processCanvas = document.getElementById('processCanvas');
            const overlayGuide = document.getElementById('overlayGuide');
            const btnModeOrden = document.getElementById('btnModeOrden');
            const btnModeFrasco = document.getElementById('btnModeFrasco');

            let supabaseClient = null;
            let realtimeChannel = null;
            let mediaStream = null;
            let selectedMode = 'orden';

            // -----------------------------------------------------------------
            // Supabase initialization
            // -----------------------------------------------------------------
            try {
                supabaseClient = window.supabase.createClient(
                    'https://yyylfrnynlgwaxxocixa.supabase.co',
                    'sb_publishable_Xlrt1FyJMNxL-XIap15MOA_YOkDe4dK'
                );
                realtimeChannel = supabaseClient.channel('jc-capture-' + token, {
                    config: { broadcast: { self: false } }
                });

                realtimeChannel.subscribe(status => {
                    if (status === 'SUBSCRIBED') {
                        statusText.innerText = '🟢 Enlazado con la PC del Doctor';
                    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                        statusText.innerText = '⚠️ Desconectado (Reconectando...)';
                    }
                });
            } catch (e) {
                console.error('[Supabase Init Error]', e);
                statusText.innerText = '⚠️ Error de enlace';
            }

            // -----------------------------------------------------------------
            // Camera handling
            // -----------------------------------------------------------------
            async function startCamera() {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    });
                    videoEl.srcObject = mediaStream;
                } catch (err) {
                    console.warn('[Camera] Falló acceso a getUserMedia, usando fallback nativo:', err);
                    switchToNativeFallback();
                }
            }

            function switchToNativeFallback() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }
                videoEl.style.display = 'none';
                overlayGuide.style.display = 'none';
                cameraInput.click();
            }

            lnkNative.addEventListener('click', e => {
                e.preventDefault();
                switchToNativeFallback();
            });

            startCamera();

            // -----------------------------------------------------------------
            // Image processing
            // -----------------------------------------------------------------
            function handleImageCaptured(source) {
                const canvas = processCanvas;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });

                const maxWidth = 1600;
                const maxHeight = 1200;
                let w = source.width || source.videoWidth || 1280;
                let h = source.height || source.videoHeight || 960;

                if (w > maxWidth || h > maxHeight) {
                    const ratio = Math.min(maxWidth / w, maxHeight / h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }

                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(source, 0, 0, w, h);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                previewImage.src = dataUrl;

                previewContainer.style.display = 'flex';
                videoEl.style.display = 'none';
                overlayGuide.style.display = 'none';
                shootingControls.style.display = 'none';
                reviewControls.style.display = 'flex';
            }

            btnCapture.addEventListener('click', () => {
                if (mediaStream && videoEl.readyState >= 2) {
                    handleImageCaptured(videoEl);
                } else {
                    cameraInput.click();
                }
            });

            cameraInput.addEventListener('change', e => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const img = new Image();
                    const url = URL.createObjectURL(file);
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        handleImageCaptured(img);
                    };
                    img.src = url;
                }
            });

            // -----------------------------------------------------------------
            // Retake handling
            // -----------------------------------------------------------------
            btnRetake.addEventListener('click', () => {
                previewContainer.style.display = 'none';
                videoEl.style.display = 'block';
                overlayGuide.style.display = 'flex';
                reviewControls.style.display = 'none';
                shootingControls.style.display = 'flex';
                cameraInput.value = '';
                if (mediaStream) {
                    // restart video if it was stopped by fallback
                    videoEl.srcObject = mediaStream;
                }
            });

            // -----------------------------------------------------------------
            // Mode switching
            // -----------------------------------------------------------------
            function switchCaptureMode(modeKey) {
                selectedMode = modeKey;
                if (modeKey === 'orden') {
                    btnModeOrden.classList.add('active');
                    btnModeFrasco.classList.remove('active');
                    btnModeOrden.style.background = 'rgba(56,189,248,0.25)';
                    btnModeOrden.style.color = '#38bdf8';
                    btnModeOrden.style.border = '1.5px solid #38bdf8';
                    btnModeFrasco.style.background = '#1e293b';
                    btnModeFrasco.style.color = '#94a3b8';
                    btnModeFrasco.style.border = '1.5px solid #475569';
                } else {
                    btnModeFrasco.classList.add('active');
                    btnModeOrden.classList.remove('active');
                    btnModeFrasco.style.background = 'rgba(56,189,248,0.25)';
                    btnModeFrasco.style.color = '#38bdf8';
                    btnModeFrasco.style.border = '1.5px solid #38bdf8';
                    btnModeOrden.style.background = '#1e293b';
                    btnModeOrden.style.color = '#94a3b8';
                    btnModeOrden.style.border = '1.5px solid #475569';
                }
            }

            btnModeOrden.addEventListener('click', () => switchCaptureMode('orden'));
            btnModeFrasco.addEventListener('click', () => switchCaptureMode('frasco'));

            // -----------------------------------------------------------------
            // Send image to PC
            // -----------------------------------------------------------------
            btnSend.addEventListener('click', async () => {
                const dataUrl = previewImage.src;
                if (!dataUrl) return;

                btnSend.disabled = true;
                btnSend.innerText = '📤 Enviando a la PC...';

                try {
                    if (realtimeChannel) {
                        await realtimeChannel.send({
                            type: 'broadcast',
                            event: 'capture',
                            payload: {
                                dataUrl,
                                filename: `orden_celular_${Date.now()}.jpg`,
                                mime: 'image/jpeg',
                                target,
                                mode: selectedMode
                            }
                        });
                    }
                    successScreen.style.display = 'flex';
                } catch (err) {
                    console.error('[Broadcast Error]', err);
                    alert('Error al enviar imagen: ' + err.message);
                    btnSend.disabled = false;
                    btnSend.innerText = '⚡ ENVIAR A LA COMPUTADORA';
                }
            });

            // -----------------------------------------------------------------
            // Success screen handling
            // -----------------------------------------------------------------
            btnAnother.addEventListener('click', () => {
                successScreen.style.display = 'none';
                btnSend.disabled = false;
                btnSend.innerText = '⚡ ENVIAR A LA COMPUTADORA';
                btnRetake.click();
            });
        })();
    </script>
</body>
</html>
