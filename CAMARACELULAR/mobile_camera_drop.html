<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Captura de Orden – JCPATHLAB Móvil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
            --bg-dark:#0F172A;
            --accent-blue:#0284C7;
            --accent-green:#10B981;
            --accent-amber:#F59E0B;
            --accent-red:#EF4444;
            --text-primary:#F1F5F9;
            --text-secondary:#94A3B8;
        }
        body{margin:0;background:#0F172A;color:#F1F5F9;font-family:system-ui,sans-serif;overflow:hidden;}
        header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1E293B;}
        .logo-title{font-weight:700;font-size:1.1rem;}
        .status-badge{display:flex;align-items:center;gap:6px;color:#38bdf8;}
        .status-dot{width:10px;height:10px;border-radius:50%;background:#38bdf8;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
        main{position:relative;height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .viewfinder-container{position:relative;width:100%;max-width:480px;height:70vh;background:#1E293B;border-radius:12px;overflow:hidden;}
        video, #previewContainer{width:100%;height:100%;object-fit:cover;}
        #previewContainer{display:none;justify-content:center;align-items:center;background:#1E293B;}
        #previewImage{max-width:100%;max-height:100%;}
        .overlay-guide{position:absolute;top:0;left:0;width:100%;height:100%;border:4px dashed #38bdf8;box-sizing:border-box;display:flex;align-items:center;justify-content:center;pointer-events:none;}
        .guide-text{color:#38bdf8;font-weight:600;background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:4px;}
        .controls-area{margin-top:12px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px;align-items:center;}
        .btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:background .2s;}
        .btn-primary{background:#0284C7;color:#fff;}
        .btn-primary:hover{background:#0369A1;}
        .btn-secondary{background:#475569;color:#F1F5F9;}
        .btn-secondary:hover{background:#334155;}
        .fallback-notice{font-size:.85rem;color:#94A3B8;margin-top:4px;}
        #reviewControls{display:none;flex-direction:column;gap:8px;width:100%;}
        #successScreen{
            position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.95);
            display:none;flex-direction:column;align-items:center;justify-content:center;color:#F1F5F9;text-align:center;padding:24px;
        }
        .success-icon{font-size:3rem;margin-bottom:12px}
        .success-title{font-size:1.4rem;font-weight:700;margin-bottom:8px}
        .success-desc{font-size:1rem;margin-bottom:20px}
        #processCanvas{display:none;}
    </style>
</head>
<body>
<header>
    <div class="logo-title">JCPATHLAB • Móvil</div>
    <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span id="statusText">Conectando...</span>
    </div>
</header>

<main>
    <div class="viewfinder-container" id="viewfinder">
        <video id="videoPreview" autoplay playsinline muted></video>
        <div id="previewContainer">
            <img id="previewImage" alt="Vista previa de orden">
        </div>
        <div class="overlay-guide" id="overlayGuide">
            <span class="guide-text">Alinee la orden médica dentro del recuadro</span>
        </div>
    </div>

    <div class="controls-area">
        <div id="shootingControls">
            <div id="modePillContainer" style="display:flex;gap:8px;margin-bottom:12px;width:100%;">
                <button type="button" id="btnModeOrden" class="mode-pill active"
                        style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #38bdf8;background:rgba(56,189,248,0.25);color:#38bdf8;font-weight:700;font-size:.82rem;cursor:pointer;transition:all .2s;">
                    📄 Orden / Hoja
                </button>
                <button type="button" id="btnModeFrasco" class="mode-pill"
                        style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #475569;background:#1e293b;color:#94a3b8;font-weight:700;font-size:.82rem;cursor:pointer;transition:all .2s;">
                    🧪 Frasco (IA 27B)
                </button>
            </div>
            <button class="btn btn-primary" id="btnCapture">📸 TOMAR FOTO DE LA ORDEN</button>
            <div class="fallback-notice">
                ¿La cámara en vivo falla? <a href="#" id="lnkNative" style="color:var(--accent-blue);">Usar cámara nativa del sistema</a>
            </div>
        </div>

        <div id="reviewControls">
            <button class="btn btn-primary" id="btnSend">⚡ ENVIAR A LA COMPUTADORA</button>
            <button class="btn btn-secondary" id="btnRetake">🔄 REPETIR FOTO</button>
        </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment">
</main>

<div id="successScreen">
    <div class="success-icon">🎉</div>
    <div class="success-title">¡Orden médica enviada con éxito a la PC!</div>
    <div class="success-desc">La imagen ha sido sincronizada en tiempo real con el sistema clínico. Puede cerrar esta ventana o tomar otra fotografía.</div>
    <button class="btn btn-primary" id="btnAnother">📸 Tomar otra foto</button>
</div>

<canvas id="processCanvas"></canvas>

<script>
(() => {
    /* ---------- Parámetros de URL ---------- */
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || 'default-token';
    const mode = params.get('mode') || 'auto';
    const target = params.get('target') || 'macro';

    /* ---------- Referencias del DOM ---------- */
    const statusText = document.getElementById('statusText');
    const videoEl = document.getElementById('videoPreview');
    const cameraInput = document.getElementById('cameraInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const shootingControls = document.getElementById('shootingControls');
    const reviewControls = document.getElementById('reviewControls');
    const btnCapture = document.getElementById('btnCapture');
    const btnSend = document.getElementById('btnSend');
    const btnRetake = document.getElementById('btnRetake');
    const lnkNative = document.getElementById('lnkNative');
    const successScreen = document.getElementById('successScreen');
    const btnAnother = document.getElementById('btnAnother');
    const processCanvas = document.getElementById('processCanvas');
    const overlayGuide = document.getElementById('overlayGuide');
    const btnModeOrden = document.getElementById('btnModeOrden');
    const btnModeFrasco = document.getElementById('btnModeFrasco');

    /* ---------- Estado ---------- */
    let selectedMode = 'orden';
    let mediaStream = null;
    let realtimeChannel = null;

    /* ---------- Canal Broadcast (LAN) ---------- */
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            realtimeChannel = new BroadcastChannel('jcpathlab_realtime_reports');
        }
        statusText.innerText = '🟢 Enlazado con la PC del Doctor (LAN Soberana)';
    } catch (e) {
        statusText.innerText = '🟢 Enlace LAN Activo';
    }

    /* ---------- Funciones auxiliares ---------- */
    const stopMedia = () => {
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
    };

    const toggleMode = (modeName) => {
        selectedMode = modeName;
        if (modeName === 'orden') {
            btnModeOrden.classList.add('active');
            btnModeFrasco.classList.remove('active');
            btnModeOrden.style.background = 'rgba(56,189,248,0.25)';
            btnModeOrden.style.border = '1.5px solid #38bdf8';
            btnModeOrden.style.color = '#38bdf8';
            btnModeFrasco.style.background = '#1e293b';
            btnModeFrasco.style.border = '1.5px solid #475569';
            btnModeFrasco.style.color = '#94a3b8';
        } else {
            btnModeFrasco.classList.add('active');
            btnModeOrden.classList.remove('active');
            btnModeFrasco.style.background = 'rgba(56,189,248,0.25)';
            btnModeFrasco.style.border = '1.5px solid #38bdf8';
            btnModeFrasco.style.color = '#38bdf8';
            btnModeOrden.style.background = '#1e293b';
            btnModeOrden.style.border = '1.5px solid #475569';
            btnModeOrden.style.color = '#94a3b8';
        }
    };

    const startCamera = async () => {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            });
            videoEl.srcObject = mediaStream;
            await videoEl.play();
        } catch (err) {
            console.warn('[Camera] getUserMedia falló, usando fallback nativo:', err);
            switchToNativeFallback();
        }
    };

    const switchToNativeFallback = () => {
        stopMedia();
        videoEl.style.display = 'none';
        cameraInput.click();
    };

    const handleImageCaptured = (source) => {
        const canvas = processCanvas;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const maxW = 1600, maxH = 1200;
        let w = source.width || source.videoWidth || 1280;
        let h = source.height || source.videoHeight || 960;

        if (w > maxW || h > maxH) {
            const ratio = Math.min(maxW / w, maxH / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
        }

        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(source, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

        previewImage.src = dataUrl;
        previewContainer.style.display = 'flex';
        videoEl.style.display = 'none';
        overlayGuide.style.display = 'none';
        shootingControls.style.display = 'none';
        reviewControls.style.display = 'flex';
    };

    const sendPayload = async (payload) => {
        try {
            if (realtimeChannel && typeof realtimeChannel.postMessage === 'function') {
                realtimeChannel.postMessage({ type: 'CAPTURE_RECEIVED', payload });
            }
            const host = window.location.hostname || '127.0.0.1';
            await fetch(`http://${host}:5678/webhook/captura-celular`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.error('[Send] error:', e);
        }
    };

    /* ---------- Eventos ---------- */
    btnModeOrden.addEventListener('click', () => toggleMode('orden'));
    btnModeFrasco.addEventListener('click', () => toggleMode('frasco'));

    lnkNative.addEventListener('click', (e) => {
        e.preventDefault();
        switchToNativeFallback();
    });

    btnCapture.addEventListener('click', () => {
        if (mediaStream && videoEl.readyState >= 2) {
            handleImageCaptured(videoEl);
        } else {
            cameraInput.click();
        }
    });

    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            handleImageCaptured(img);
        };
        img.src = url;
    });

    btnRetake.addEventListener('click', () => {
        previewContainer.style.display = 'none';
        videoEl.style.display = 'block';
        overlayGuide.style.display = 'flex';
        reviewControls.style.display = 'none';
        shootingControls.style.display = 'flex';
        cameraInput.value = '';
        if (mediaStream) videoEl.play();
    });

    btnSend.addEventListener('click', async () => {
        const dataUrl = previewImage.src;
        if (!dataUrl) return;

        btnSend.disabled = true;
        btnSend.innerText = '📤 Enviando a la PC...';

        const payload = {
            dataUrl,
            filename: `orden_celular_${Date.now()}.jpg`,
            mime: 'image/jpeg',
            target,
            mode: selectedMode,
            token
        };

        await sendPayload(payload);
        successScreen.style.display = 'flex';
    });

    btnAnother.addEventListener('click', () => {
        successScreen.style.display = 'none';
        btnSend.disabled = false;
        btnSend.innerText = '⚡ ENVIAR A LA COMPUTADORA';
        btnRetake.click();
    });

    window.addEventListener('beforeunload', stopMedia);

    /* ---------- Inicialización ---------- */
    startCamera();
})();
</script>
</body>
</html>
