        (function() {
            let currentUser = null;
            try {
                currentUser = JSON.parse(localStorage.getItem('currentUser'));

                currentUser = null;
            }
            if (!currentUser) {
                window.location.replace('login.html');
            }
        })();

<body>
    <!-- Overlay de Carga en tiempo real -->
    <div id="loadingOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: Arial, sans-serif; transition: opacity 0.5s ease;">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #1b3e85; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 16px; color: #1b3e85; font-weight: bold; letter-spacing: -0.01em;">Cargando informe en tiempo real...</div>
        <style>
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </div>

    <!-- TOOLBAR SUPERIOR DEL VISOR (NO SE IMPRIME) -->
    <div id="pvToolbar" class="pv-toolbar no-print">
        <div class="pv-tb-left">
            <span class="pv-tb-icon">📄</span>
            <span id="pvDocTitle" class="pv-tb-title">VISTA PREVIA DEL INFORME</span>
        </div>
        <div class="pv-tb-center">
            <button class="pv-btn-icon" onclick="changeZoom(-0.1)" title="Alejar (-)">➖</button>
            <span id="pvZoomLevel" class="pv-tb-zoom">100%</span>
            <button class="pv-btn-icon" onclick="changeZoom(0.1)" title="Acercar (+)">➕</button>
            <button class="pv-btn-sm" onclick="resetZoom()" title="Restablecer Escala">Restablecer</button>
            <div class="pv-divider"></div>
            <span class="pv-tb-pages">Página <strong>1</strong> de <strong>1</strong></span>

    <!-- SCRIPT DE LÓGICA Y NAVEGACIÓN -->
    <script>
        // Lógica de Zoom del Visor (Escalado Proporcional Sin Desbordamiento)
        let currentZoom = 1.0;
        window.changeZoom = (delta) => {
            currentZoom = Math.max(0.6, Math.min(2.0, parseFloat((currentZoom + delta).toFixed(2))));
            document.documentElement.style.setProperty('--pv-zoom', currentZoom);
            const zoomTxt = document.getElementById('pvZoomLevel');
            if (zoomTxt) zoomTxt.textContent = `${Math.round(currentZoom * 100)}%`;
        };

        window.resetZoom = () => {
            currentZoom = 1.0;
            document.documentElement.style.setProperty('--pv-zoom', 1.0);
            const zoomTxt = document.getElementById('pvZoomLevel');
            if (zoomTxt) zoomTxt.textContent = '100%';
        };

        window.adjustImagesAesthetics = () => {
            const imgContainers = document.querySelectorAll('.report-images');
            if (!imgContainers || imgContainers.length === 0) return;

            imgContainers.forEach(imgContainer => {
                const wrappers = imgContainer.querySelectorAll('.report-img-wrapper');
                if (wrappers.length === 0) {
                    imgContainer.remove();
                    return;
                }
                const imgs = imgContainer.querySelectorAll('.report-img');
                if (imgs.length === 0) {
                    imgContainer.remove();
                    return;
                }

                const isSingle = wrappers.length === 1;
                wrappers.forEach(wrapper => {
                    const img = wrapper.querySelector('.report-img');
                    if (isSingle) {
                        wrapper.style.setProperty('width', '215px', 'important');
                        wrapper.style.setProperty('height', '215px', 'important');
                        wrapper.style.setProperty('max-height', '215px', 'important');
                        wrapper.style.setProperty('aspect-ratio', '1 / 1', 'important');
                        wrapper.style.setProperty('margin', '0 auto', 'important');
                        if (img) {
                            img.style.setProperty('height', '100%', 'important');
                            img.style.setProperty('width', '100%', 'important');
                            img.style.setProperty('object-fit', 'cover', 'important');
                        }
                    } else {
                        wrapper.style.setProperty('width', '48.5%', 'important');
                        wrapper.style.setProperty('height', '175px', 'important');
                        wrapper.style.setProperty('max-height', '180px', 'important');
                        wrapper.style.setProperty('aspect-ratio', '1 / 1', 'important');
                        if (img) {
                            img.style.setProperty('height', '100%', 'important');
                            img.style.setProperty('width', '100%', 'important');
                            img.style.setProperty('object-fit', 'cover', 'important');
                        }
                    }
                });
            });
        };

        window.volverAEditar = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codAtencion = urlParams.get('codAtencion');
            if (window.opener && !window.opener.closed) {
                try {
                    if (codAtencion && typeof window.opener.handleAction === 'function') {
                        window.opener.handleAction('editar', codAtencion);
                    }
                    window.opener.focus();
                    window.close();
                    return;
                } catch (e) {
                    console.error(e);
                }
            }
            if (codAtencion) {
                window.location.href = `reportes.html?edit=${encodeURIComponent(codAtencion)}`;
            } else {
                window.location.href = 'reportes.html';
            }
        };

        function isValidImageSrc(src) {
            if (!src || typeof src !== 'string') return false;
            const clean = src.trim();
            if (!clean || clean === 'null' || clean === 'undefined' || clean === 'none' || clean === '{}' || clean === '[]' || clean === 'about:blank' || clean === '""') {
                return false;
            }
            if (clean.includes('/reportes.html') || clean.includes('/imprimir.html') || clean.endsWith('.html')) {
                return false;
            }
            if (clean.startsWith('data:image/')) {
                return clean.length > 50 && clean.includes(';base64,') && !clean.endsWith(';base64,');
            }
            if (clean.startsWith('http://') || clean.startsWith('https://') || clean.startsWith('blob:') || clean.startsWith('/') || clean.startsWith('./')) {
                return true;
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawCodAtencion = urlParams.get('codAtencion') || '';
            const paramCodAtencion = rawCodAtencion.trim().toUpperCase();
            const isAutoDownload = urlParams.get('autoDownload') === 'true';

            // Si es modo firma / autoDownload directo, ocultar toolbar del visor y ajustar el diseño
            if (isAutoDownload) {
                document.body.classList.add('auto-download-active');
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
                
                const tb = document.getElementById('pvToolbar');
                const sb = document.getElementById('pvSidebar');
                if (tb) tb.style.display = 'none';
                if (sb) sb.style.display = 'none';
                
                const mainLayout = document.querySelector('.pv-main-layout');
                if (mainLayout) {
                    mainLayout.style.marginTop = '0';
                    mainLayout.style.minHeight = 'auto';
                }
                
                const canvas = document.querySelector('.pv-canvas');
                if (canvas) {
                    canvas.style.marginLeft = '0';
                    canvas.style.padding = '0';
                    canvas.style.minHeight = 'auto';
                }
                
                const sheet = document.getElementById('pvSheet');
                if (sheet) {
                    sheet.style.boxShadow = 'none';
                    sheet.style.margin = '0 auto';
                }
            }

            let patient = null;

            // 1. Intentar primero localStorage (lectura instantánea 0 ms)
            const dataStr = localStorage.getItem('printPatientData');
            if (dataStr) {
                try {
                    const localPat = JSON.parse(dataStr);
                    const localCode = String(localPat.codAtencion || '').trim().toUpperCase();
                    if (!paramCodAtencion || localCode === paramCodAtencion || localCode.replace(/[-_\s]/g, '') === paramCodAtencion.replace(/[-_\s]/g, '')) {
                        patient = localPat;
                        console.log("[imprimir.html] Datos cargados de localStorage al instante.");
                    }
                } catch (e) {
                    console.error("Error al parsear printPatientData de localStorage", e);
                }
            }

            // 2. Si no está en localStorage y hay codAtencion, consultar Supabase con timeout de 2.5s
            if (!patient && paramCodAtencion && window.supabase && typeof window.SUPABASE_CONFIG !== 'undefined') {
                try {
                    const supabasePromise = window.supabase
                        .from('pacientes')
                        .select('*')
                        .ilike('cod_atencion', paramCodAtencion)
                        .maybeSingle();
                    
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Supabase Timeout")), 2500));
                    const res = await Promise.race([supabasePromise, timeoutPromise]);
                    
                    if (res && res.data) {
                        const data = res.data;
                        patient = {
                            codAtencion: data.cod_atencion,
                            dni: data.dni,
                            nombres: data.nombres,
                            apellidos: data.apellidos,
                            paciente: data.paciente,
                            edad: data.edad,
                            sexo: data.sexo === 'M' ? 'MASCULINO' : (data.sexo === 'F' ? 'FEMENINO' : 'MASCULINO'),
                            fecRegistro: data.fec_registro,
                            fecEntrega: data.fec_entrega,
                            medSolicitante: data.med_solicitante,
                            especimen: data.especimen,
                            motivoEstudio: data.motivo_estudio,
                            macroDesc: data.macro_desc,
                            microDesc: data.micro_desc,
                            diagnostico: data.diagnostico,
                            img01: data.img01,
                            img02: data.img02,
                            macro360: data.macro360,
                            service: data.service
                        };
                    }
                } catch (e) {
                    console.error("[Supabase Fetch Error]", e);
                }
            }

            // 3. Fallback a IndexedDB
            if (!patient && paramCodAtencion) {
                try {
                    const IDB_NAME = 'ClinicaReportesDB';
                    const STORE_NAME = 'pacientes_completos';
                    const db = await new Promise((resolve, reject) => {
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(STORE_NAME)) {
                                db.createObjectStore(STORE_NAME, { keyPath: 'codAtencion' });
                            }
                        };
                        request.onsuccess = (e) => resolve(e.target.result);
                        request.onerror = (e) => reject(e.target.error);
                    });
                    const dbPat = await new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE_NAME, 'readonly');
                        const store = tx.objectStore(STORE_NAME);
                        const req = store.get(paramCodAtencion);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                    if (dbPat) {
                        patient = dbPat;
                        console.log("[IndexedDB] Datos cargados con éxito.");
                    }
                } catch (e) {
                    console.error("[IndexedDB Fetch Error]", e);
                }
            }

            // 4. Fallback a catálogo maestro window.REAL_SUPABASE_PATIENTS
            if ((!patient || !patient.macroDesc || !patient.diagnostico) && paramCodAtencion && typeof window.REAL_SUPABASE_PATIENTS !== 'undefined' && Array.isArray(window.REAL_SUPABASE_PATIENTS)) {
                const cleanParam = paramCodAtencion.replace(/[-_\s]/g, '');
                const bkp = window.REAL_SUPABASE_PATIENTS.find(b => String(b.codAtencion || '').trim().toUpperCase().replace(/[-_\s]/g, '') === cleanParam);
                if (bkp) {
                    if (!patient) {
                        patient = { ...bkp };
                    } else {
                        if (!patient.macroDesc && bkp.macroDesc) patient.macroDesc = bkp.macroDesc;
                        if (!patient.microDesc && bkp.microDesc) patient.microDesc = bkp.microDesc;
                        if (!patient.diagnostico && bkp.diagnostico) patient.diagnostico = bkp.diagnostico;
                        if (!patient.especimen && bkp.especimen) patient.especimen = bkp.especimen;
                        if (!patient.dni && bkp.dni) patient.dni = bkp.dni;
                        if (!patient.medSolicitante && bkp.medSolicitante) patient.medSolicitante = bkp.medSolicitante;
                        if (!patient.clinica && bkp.clinica) patient.clinica = bkp.clinica;
                    }
                }
            }

            const overlay = document.getElementById('loadingOverlay');

            const renderPatientData = (pat) => {
                if (!pat) return;
                patient = pat;

                const formattedDate = (d) => {
                    if (!d) return '';
                    const parts = d.split('-');
                    if (parts.length === 3) {
                        return `${parts[2]}/${parts[1]}/${parts[0]}`;
                    }
                    return d;
                };
                
                let nombresApellidos = '';
                if (pat.apellidos && pat.nombres) {
                    nombresApellidos = `${pat.apellidos}, ${pat.nombres}`.toUpperCase();
                } else {
                    nombresApellidos = (pat.apellidos || pat.nombres || pat.paciente || '').toUpperCase();
                }
                const age = pat.edad || '';
                const sex = pat.sexo ? ((pat.sexo === 'F' || pat.sexo === 'FEMENINO' || pat.sexo === 'f') ? 'FEMENINO' : 'MASCULINO') : '';
                const code = pat.codAtencion || '';
                const dateRecepcion = formattedDate(pat.fecRegistro || '');
                const dateInforme = formattedDate(pat.fecEntrega || '');
                const indicacion = (pat.medSolicitante || '').toUpperCase();
                
                const macro = pat.macroDesc || '';
                const micro = pat.microDesc || '';
                const diagnostico = pat.diagnostico || '';
                const isCitologia = pat.service === 'C';

                const docTitleStr = `${code} - ${nombresApellidos}`.trim();
                document.title = docTitleStr;
                const pvTitleElem = document.getElementById('pvDocTitle');
                if (pvTitleElem) pvTitleElem.textContent = docTitleStr;

                const correctSpellingOfPapanicolaouAndCitologia = (text) => {
                    if (!text) return '';
                    const papanicolaouRegex = /\bpapa?ni[co]o?l?[a-z]{0,6}\b/gi;
                    text = text.replace(papanicolaouRegex, (match) => {
                        if (match === match.toUpperCase()) return 'PAPANICOLAOU';
                        if (match === match.toLowerCase()) return 'papanicolaou';
                        return 'Papanicolaou';
                    });
                    const citologiaRegex = /\bcito[lgj][ií]a\s+cervical\b/gi;
                    text = text.replace(citologiaRegex, (match) => {
                        if (match === match.toUpperCase()) return 'CITOLOGÍA CERVICAL';
                        if (match.startsWith('C') || match.startsWith('c')) {
                            return match[0] === 'C' ? 'Citología cervical' : 'citología cervical';
                        }
                        return 'citología cervical';
                    });
                    return text;
                };

                const cleanAndSanitizeReportText = (inputStr, headerToFilter = '') => {
                    if (!inputStr) return '';
                    let str = String(inputStr);
                    str = str.replace(/\\+n/gi, '\n');
                    str = str.replace(/\\+N/gi, '\n');
                    str = correctSpellingOfPapanicolaouAndCitologia(str);
                    str = str.replace(/\b(tros|otros)\s+hallazgos\b/gi, (match) => {
                        if (match === match.toUpperCase()) return 'OTROS HALLAZGOS';
                        return 'Otros hallazgos';
                    });
                    str = str.replace(/\bbethesda\b/gi, 'Bethesda');
                    str = str.replace(/\bRganismo:?\s*/gi, 'Organismo: ');
                    str = str.replace(/\brganismo:?\s*/gi, 'organismo: ');
                    str = str.replace(/\bsydney\b/gi, 'Sydney');

                    // Strip literal bullets and entities everywhere (preserving vowels like o and O)
                    str = str.replace(/[\u2022\u25cf\u25cb\u25aa\u25a0\u2023\u2043\u25b6\u25c0\u25c6\u2045\u2046\u2219\u25e6\u2024\u2027\u00b7\*\-\u2013\u2014]/g, ' ');
                    str = str.replace(/&bull;|&#8226;|&#x2022;/gi, ' ');

                    str = str.replace(/<\/?(?:ul|ol|li|p|div|header|section)[^>]*>/gi, '\n');
                    str = str.replace(/<br\s*\/?>/gi, '\n');
                    // Strip all other HTML tags to prevent style leakage
                    str = str.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*[^>]*>/gi, '');
                    str = str.replace(/&nbsp;/g, ' ');
                    str = str.replace(/([a-zñáéíóú0-9\)])\.([A-ZÑÁÉÍÓÚa-zñáéíóú])/g, '$1. $2');

                    let rawLines = str.split('\n');
                    let cleanedLines = [];
                    for (let raw of rawLines) {
                        let line = raw.trim();
                        line = line.replace(/^(DIAGN.STICO\s+CITOL.GICO|DIAGNOSTICO\s+CITOLOGICO):?\s*/i, '');
                        line = line.replace(/\s+/g, ' ');
                        if (line.length === 0) continue;
                        cleanedLines.push(line);
                    }

                    let uniqueLines = [];
                    for (let i = 0; i < cleanedLines.length; i++) {
                        const normCurrent = cleanedLines[i].toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '');
                        const normPrev = i > 0 ? cleanedLines[i - 1].toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '') : '';
                        if (i === 0 && headerToFilter) {
                            const normHeader = headerToFilter.toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '');
                            if (normCurrent && (normCurrent.includes(normHeader) || normHeader.includes(normCurrent))) continue;
                        }
                        if (normCurrent.length > 0 && normCurrent !== normPrev) {
                            uniqueLines.push(cleanedLines[i]);
                        }
                    }

                    if (uniqueLines.length === 0) return '';

                    let paragraphBuffers = [];
                    let currentBuffer = '';

                    for (let i = 0; i < uniqueLines.length; i++) {
                        let line = uniqueLines[i];
                        if (!currentBuffer) {
                            currentBuffer = line;
                        } else {
                            // Only split into separate paragraphs for numbered items (1. ) or major ALL-CAPS section headers (NOTA:, CONCLUSIÓN:)
                            const currIsMajorHeading = /^(\d+\.|\b[A-ZÁÉÍÓÚÑ]{4,}:)/.test(line);

                            if (currIsMajorHeading) {
                                paragraphBuffers.push(currentBuffer);
                                currentBuffer = line;
                            } else {
                                if (!currentBuffer.endsWith(' ') && !line.startsWith(' ')) {
                                    if (!/[.:;?!]$/.test(currentBuffer.trim())) {
                                        currentBuffer += '.';
                                    }
                                    currentBuffer += ' ';
                                }
                                let firstWord = line.split(/\s+/)[0];
                                if (firstWord && firstWord.length > 1 && !/^[A-ZÁÉÍÓÚÑ]{2,}$/.test(firstWord) && !/^(Topografía|Actividad|Atrofia|Metaplasia|Organismo|Helicobacter|Bethesda|Papanicolaou|Sydney)/i.test(firstWord)) {
                                    line = firstWord.charAt(0).toLowerCase() + firstWord.slice(1) + (line.length > firstWord.length ? line.slice(firstWord.length) : '');
                                }
                                currentBuffer += line;
                            }
                        }
                    }
                    if (currentBuffer) {
                        paragraphBuffers.push(currentBuffer);
                    }

                    let processedParagraphs = paragraphBuffers.map(p => {
                        let trimmed = p.trim();
                        if (!trimmed) return '';
                        trimmed = trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
                        if (!/[.:;?!]$/.test(trimmed)) {
                            trimmed += '.';
                        }
                        return trimmed;
                    });

                    return processedParagraphs.join('<br><br>');
                };

                const formatMicroscopicDescription = (text) => {
                    if (!text) return '';
                    let str = String(text);
                    str = str.replace(/\\+n/gi, '\n');
                    str = str.replace(/\\+N/gi, '\n');
                    str = correctSpellingOfPapanicolaouAndCitologia(str);
                    str = str.replace(/\b(tros|otros)\s+hallazgos\b/gi, (match) => {
                        if (match === match.toUpperCase()) return 'OTROS HALLAZGOS';
                        return 'Otros hallazgos';
                    });
                    str = str.replace(/\bbethesda\b/gi, 'Bethesda');
                    str = str.replace(/<\/?(?:ul|ol|li|p|div|header|section)[^>]*>/gi, '\n');
                    str = str.replace(/<br\s*\/?>/gi, '\n');
                    // Strip all other HTML tags to prevent style leakage
                    str = str.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*[^>]*>/gi, '');
                    str = str.replace(/&nbsp;/g, ' ');
                    str = str.replace(/&bull;|&#8226;|&#x2022;/gi, '');
                    str = str.replace(/([a-zñáéíóú0-9\)])\.([A-ZÑÁÉÍÓÚa-zñáéíóú])/g, '$1. $2');

                    // Corregir espacios antes de dos puntos (ej: "Tinción :" -> "Tinción:")
                    str = str.replace(/\s+:/g, ':');

                    // Insertar salto de línea antes de secciones numeradas si están pegadas en la misma línea
                    str = str.replace(/([^\n])\s+(\b[1-9]\.\s+[A-ZÁÉÍÓÚÑa-záéíóúñ])/g, '$1\n$2');

                    // Insertar salto de línea antes de campos citológicos conocidos si están en la misma línea
                    const cytologyLabels = [
                        'tinción:', 'clasificación:', 'adecuación:', 'celularidad:',
                        'células endocervicales:', 'células endocervicales / zona de transformación:',
                        'calidad de la preservación celular:', 'calidad de la preservación:',
                        'células escamosas:', 'células glandulares:', 'microorganismos:',
                        'cambios reactivos/reparativos:', 'otros hallazgos:'
                    ];
                    cytologyLabels.forEach(lbl => {
                        const esc = lbl.replace(/[\/]/g, '\\$&');
                        const regex = new RegExp(`([^\\n])\\s+(\\b${esc})`, 'gi');
                        str = str.replace(regex, '$1\n$2');
                    });

                    let rawLines = str.split('\n');
                    let cleanedLines = [];
                    const bulletRegex = /^[\s\u00A0]*[\u2022\u25cf\u25cb\u25aa\u25a0\u2023\u2043\u25b6\u25c0\u25c6\u2045\u2046\u2219\u25e6\u2024\u2027\u00b7\*\-\u2013\u2014]+[\s\u00A0]*/i;
                    for (let raw of rawLines) {
                        let line = raw.trim();
                        line = line.replace(bulletRegex, '');
                        line = line.replace(/^[\u2022\u25cb]\s+/g, '');
                        line = line.trim();
                        if (line.length > 0) cleanedLines.push(line);
                    }

                    let uniqueLines = [];
                    for (let i = 0; i < cleanedLines.length; i++) {
                        const normCurrent = cleanedLines[i].toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '');
                        const normPrev = i > 0 ? cleanedLines[i - 1].toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, '') : '';
                        if (normCurrent.length > 0 && normCurrent !== normPrev) uniqueLines.push(cleanedLines[i]);
                    }

                    const formattedLines = uniqueLines.map(line => {
                        let trimmed = line.trim();
                        if (!trimmed) return '';
                        if (/^\d+\./.test(trimmed)) {
                            return `<b style="display:block; margin-top:6px; margin-bottom:2px; text-transform:uppercase;">${trimmed.toUpperCase()}</b>`;
                        }
                        if (trimmed.includes(':')) {
                            const colonIndex = trimmed.indexOf(':');
                            const label = trimmed.substring(0, colonIndex).trim();
                            const value = trimmed.substring(colonIndex + 1).trim();
                            // Estructura en línea (sin flexbox) para permitir un copiado armónico en texto plano
                            return `<div class="micro-row" style="margin-bottom:2px; line-height:1.3;"><span class="micro-label" style="display:inline-block; width:260px; font-weight:600; text-transform:capitalize;">${label}</span><span class="micro-sep" style="display:inline-block; width:15px; text-align:center; margin-right:5px;">:</span><span class="micro-val">${value}</span></div>`;
                        }
                        return `<div style="margin-bottom:1px; line-height:1.25;">${trimmed}</div>`;
                    });

                    let joined = formattedLines.filter(l => l !== '').join('');
                    return joined.replace(/(>|\.\s+|\n+|^)([a-z\u00e1\u00e9\u00ed\u00f3\u00fa\u00f1])/gi, (match, prefix, char) => (prefix || '') + (char || '').toUpperCase());
                };

                // --- NEW PAGINATION LOGIC ---
                const canvas = document.querySelector('.pv-canvas');
                if (!canvas) return;
                canvas.innerHTML = '';

                // Create offscreen measure container
                const measurePage = document.createElement('div');
                measurePage.id = 'measurePage';
                measurePage.style.position = 'absolute';
                measurePage.style.visibility = 'hidden';
                measurePage.style.width = '178mm'; // 210mm sheet width minus 16mm left and 16mm right padding
                measurePage.style.boxSizing = 'border-box';
                measurePage.style.height = 'auto';
                measurePage.style.minHeight = '0';
                measurePage.style.display = 'flow-root'; // Prevent margin collapsing
                measurePage.style.top = '-9999px';
                measurePage.style.left = '-9999px';
                measurePage.style.fontFamily = 'Arial, sans-serif';
                measurePage.style.fontSize = '9.5pt';
                measurePage.style.lineHeight = '1.35';
                document.body.appendChild(measurePage);

                const SAFE_HEIGHT = 995; // safe content height limit (matches A4 1010px printable canvas)

                // Build layout blocks
                const blocks = [];

                const splitTextToBlocks = (textStr, secName) => {
                    if (!textStr) return [];
                    const rawParas = textStr.split(/(?:<br\s*\/?>|\n\n+)/i).filter(p => p.trim());
                    const subBlocks = [];
                    rawParas.forEach(para => {
                        const cleanP = para.trim();
                        if (cleanP.length > 350) {
                            const sentences = cleanP.split(/(?<=\.)\s+/);
                            let chunk = '';
                            sentences.forEach(s => {
                                if ((chunk + ' ' + s).length > 350 && chunk.length > 0) {
                                    subBlocks.push({ type: 'content', html: chunk.trim(), section: secName });
                                    chunk = s;
                                } else {
                                    chunk = chunk ? (chunk + ' ' + s) : s;
                                }
                            });
                            if (chunk.trim()) {
                                subBlocks.push({ type: 'content', html: chunk.trim(), section: secName });
                            }
                        } else {
                            subBlocks.push({ type: 'content', html: cleanP, section: secName });
                        }
                    });
                    return subBlocks;
                };

                const cleanMacro = cleanAndSanitizeReportText(macro);
                if (cleanMacro) {
                    blocks.push({ type: 'title', html: `DESCRIPCIÓN MACROSCÓPICA:`, section: 'macro' });
                    const macroSubBlocks = splitTextToBlocks(cleanMacro, 'macro');
                    macroSubBlocks.forEach(b => blocks.push(b));
                }

                let cleanMicro = '';
                if (isCitologia) {
                    cleanMicro = formatMicroscopicDescription(micro);
                    if (cleanMicro) {
                        blocks.push({ type: 'title', html: `DESCRIPCIÓN MICROSCÓPICA:`, section: 'micro' });
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = cleanMicro;
                        const children = tempDiv.childNodes;
                        for (let childIdx = 0; childIdx < children.length; childIdx++) {
                            const child = children[childIdx];
                            if (child.outerHTML) {
                                blocks.push({ type: 'content', html: child.outerHTML, section: 'micro' });
                            } else if (child.textContent.trim()) {
                                blocks.push({ type: 'content', html: child.textContent, section: 'micro' });
                            }
                        }
                    }
                } else {
                    cleanMicro = cleanAndSanitizeReportText(micro);
                    if (cleanMicro) {
                        blocks.push({ type: 'title', html: `DESCRIPCIÓN MICROSCÓPICA:`, section: 'micro' });
                        const microSubBlocks = splitTextToBlocks(cleanMicro, 'micro');
                        microSubBlocks.forEach(b => blocks.push(b));
                    }
                }

                const cleanDiag = cleanAndSanitizeReportText(diagnostico);
                if (cleanDiag) {
                    const diagTitle = isCitologia ? 'DIAGNÓSTICO CITOLÓGICO:' : 'DIAGNÓSTICO HISTOLÓGICO:';
                    blocks.push({ type: 'title', html: diagTitle, section: 'diag' });
                    const fontSize = isCitologia ? '8.5pt' : '10.5pt';
                    const paragraphs = cleanDiag.split(/<br\s*\/?>/i).filter(p => p.trim());
                    
                    let innerHtml = '';
                    const paragraphHtmls = paragraphs.map(p => `<p class="diag-text" style="font-size: ${fontSize}; margin: 4px 0; text-align: justify; line-height: 1.35; text-transform: uppercase;">${p}</p>`);
                    innerHtml += paragraphHtmls.join('');
                    
                    blocks.push({
                        type: 'content',
                        html: innerHtml,
                        section: 'diag'
                    });
                }

                // Images (2D y Foto Macroscópica 360°)
                const validImg01 = isValidImageSrc(pat.img01) ? pat.img01 : null;
                const validImg02 = isValidImageSrc(pat.img02) ? pat.img02 : null;
                const validMacro360 = (Array.isArray(pat.macro360) && pat.macro360.length > 0 && isValidImageSrc(pat.macro360[0])) ? pat.macro360[0] : null;

                const hasImg01 = !!validImg01;
                const hasImg02 = !!validImg02;
                const hasMacro360 = !!validMacro360;

                if (hasImg01 || hasImg02 || hasMacro360) {
                    let imagesHtml = '';
                    if (hasImg01) {
                        imagesHtml += `<div class="report-img-wrapper"><img src="${validImg01}" class="report-img" onerror="const w=this.closest('.report-img-wrapper'); if(w){w.remove();}"></div>`;
                    } else if (hasMacro360) {
                        imagesHtml += `<div class="report-img-wrapper" style="position: relative;"><img src="${validMacro360}" class="report-img" onerror="const w=this.closest('.report-img-wrapper'); if(w){w.remove();}"><div style="position: absolute; bottom: 4px; right: 4px; background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-size: 7.5px; font-weight: 800; padding: 2px 5px; border-radius: 3px; border: 1px solid rgba(56, 189, 248, 0.4);">📸 Macroscopía 360°</div></div>`;
                    }
                    if (hasImg02) {
                        imagesHtml += `<div class="report-img-wrapper"><img src="${validImg02}" class="report-img" onerror="const w=this.closest('.report-img-wrapper'); if(w){w.remove();}"></div>`;
                    }
                    if (imagesHtml.trim() !== '') {
                        blocks.push({ type: 'images', html: imagesHtml, section: 'images' });
                    }
                }

                // Signature
                const sigHtml = `
                    <div class="sig-block">
                        <img src="firma_sello.png" class="sig-img">
                    </div>
                `;
                blocks.push({ type: 'signature', html: sigHtml, section: 'signature' });

                // Measure block heights in measurePage
                blocks.forEach(b => {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = b.html;
                    
                    if (b.type === 'title') {
                        tempDiv.className = 'section-title';
                    } else if (b.type === 'content') {
                        tempDiv.className = 'section-content';
                        if (b.section === 'micro' && isCitologia) {
                            tempDiv.classList.add('micro-citologia-item');
                        }
                        if (b.section === 'diag') {
                            tempDiv.classList.add('diag-content');
                        }
                    } else if (b.type === 'images') {
                        tempDiv.className = `report-images ${hasImg01 && hasImg02 ? 'two-images' : 'one-image'}`;
                        tempDiv.innerHTML = b.html;
                    } else if (b.type === 'signature') {
                        tempDiv.className = 'footer-signature';
                        tempDiv.style.marginTop = '30px';
                    }

                    measurePage.innerHTML = '';
                    measurePage.appendChild(tempDiv);
                    
                    let h = measurePage.offsetHeight;
                    
                    // Apply fallbacks for unloaded assets ONLY when valid blocks exist
                    if (b.type === 'images' && (hasImg01 || hasImg02 || hasMacro360) && h < 150) {
                        h = (hasImg01 && hasImg02) ? 175 : 205;
                    }
                    if (b.type === 'signature' && h < 90) {
                        h = 130;
                    }
                    
                    b.h = h;
                });

                const createNewPage = (pageNum) => {
                    const sheet = document.createElement('div');
                    sheet.className = 'pv-sheet';
                    
                    const contentWrapper = document.createElement('div');
                    contentWrapper.className = 'content-wrapper';
                    contentWrapper.style.flex = '1';
                    contentWrapper.style.display = 'flex';
                    contentWrapper.style.flexDirection = 'column';
                    
                    let currentHeight = 0;

                    if (pageNum === 1) {
                        const headerHTML = `
                            <table style="width: 100%; border: none; border-collapse: collapse;">
                                <thead><tr><td><div class="header-space" style="height: 2mm;"></div></td></tr></thead>
                                <tbody>
                                    <tr>
                                        <td style="padding: 0;">
                                            <div class="header-container">
                                                <img src="header_reporte.png?v=2" class="header-img">
                                            </div>
                                            <div class="meta-table-wrapper">
                                                <table class="meta-table">
                                                    <tr>
                                                        <td colspan="2" class="meta-cell"><span class="meta-label">APELLIDOS Y NOMBRES :</span> ${nombresApellidos}</td>
                                                        <td rowspan="3" class="code-cell">${code}</td>
                                                    </tr>
                                                    <tr>
                                                        <td class="meta-cell" style="width: 37.5%;"><span class="meta-label">EDAD :</span> ${age} AÑOS</td>
                                                        <td class="meta-cell" style="width: 37.5%;"><span class="meta-label">SEXO :</span> ${sex}</td>
                                                    </tr>
                                                    <tr>
                                                        <td class="meta-cell" style="width: 37.5%;"><span class="meta-label">FECHA DE RECEPCIÓN :</span> ${dateRecepcion}</td>
                                                        <td class="meta-cell" style="width: 37.5%;"><span class="meta-label">FECHA DE INFORME :</span> ${dateInforme}</td>
                                                    </tr>
                                                    <tr>
                                                        <td colspan="3" class="meta-cell"><span class="meta-label">INDICACIÓN:</span> ${indicacion}</td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        `;
                        contentWrapper.innerHTML = headerHTML;
                        measurePage.innerHTML = headerHTML;
                        currentHeight = Math.max(measurePage.offsetHeight, 260);
                    } else {
                        const compactHeaderHTML = `
                            <div style="border-bottom: 2px solid #0f766e; padding-bottom: 5px; margin-bottom: 15px; font-size: 9pt; font-weight: bold; color: #0f766e; text-transform: uppercase;">
                                INFORME ANATOMOPATOLÓGICO (CONTINUACIÓN) | CÓDIGO: ${code} | PACIENTE: ${nombresApellidos}
                            </div>
                        `;
                        contentWrapper.innerHTML = compactHeaderHTML;
                        measurePage.innerHTML = compactHeaderHTML;
                        currentHeight = measurePage.offsetHeight;
                    }
                    
                    sheet.appendChild(contentWrapper);
                    return { sheet, contentWrapper, currentHeight };
                };

                const runPagination = (blocksList) => {
                    const pagesResult = [];
                    let currentPageNum = 1;
                    let activePage = createNewPage(currentPageNum);
                    pagesResult.push(activePage);

                    for (let i = 0; i < blocksList.length; i++) {
                        const block = blocksList[i];
                        let needsNewPage = block.forceNewPage;

                        if (!needsNewPage && activePage.currentHeight > 150) {
                            let heightToCheck = block.h;
                            
                            // Orphan prevention: if title, look ahead to check title + first content block height
                            if (block.type === 'title' && i + 1 < blocksList.length && blocksList[i+1].type === 'content') {
                                heightToCheck = block.h + blocksList[i+1].h;
                            }

                            if (activePage.currentHeight + heightToCheck > SAFE_HEIGHT) {
                                needsNewPage = true;
                            }
                        }

                        if (needsNewPage) {
                            currentPageNum++;
                            activePage = createNewPage(currentPageNum);
                            pagesResult.push(activePage);
                        }

                        const div = document.createElement('div');
                        div.innerHTML = block.html;
                        
                        if (block.type === 'title') {
                            div.className = 'section-title';
                            if (block.section === 'diag') {
                                div.id = 'lblDiagTitle';
                            }
                        } else if (block.type === 'content') {
                            div.className = 'section-content';
                            if (block.section === 'micro' && isCitologia) {
                                div.classList.add('micro-citologia-item');
                            }
                            if (block.section === 'diag') {
                                div.classList.add('diag-content');
                            }
                        } else if (block.type === 'images') {
                            div.className = `report-images ${hasImg01 && hasImg02 ? 'two-images' : 'one-image'}`;
                        } else if (block.type === 'signature') {
                            div.className = 'footer-signature';
                        }
                        
                        activePage.contentWrapper.appendChild(div);
                        activePage.currentHeight += block.h;
                    }

                    // Eliminar estrictamente cualquier página fantasma que no contenga bloques reales de informe
                    const validPages = pagesResult.filter(p => {
                        return p.contentWrapper.querySelector('.section-title, .section-content, .report-images, .footer-signature') !== null;
                    });
                    return validPages.length > 0 ? validPages : pagesResult;
                };

                // Function to measure block heights dynamically
                const updateBlockHeights = () => {
                    blocks.forEach(b => {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = b.html;
                        
                        if (b.type === 'title') {
                            tempDiv.className = 'section-title';
                        } else if (b.type === 'content') {
                            tempDiv.className = 'section-content';
                            if (b.section === 'micro' && isCitologia) {
                                tempDiv.classList.add('micro-citologia-item');
                            }
                            if (b.section === 'diag') {
                                tempDiv.classList.add('diag-content');
                            }
                        } else if (b.type === 'images') {
                            tempDiv.className = `report-images ${hasImg01 && hasImg02 ? 'two-images' : 'one-image'}`;
                        } else if (b.type === 'signature') {
                            tempDiv.className = 'footer-signature';
                        }

                        measurePage.innerHTML = '';
                        measurePage.appendChild(tempDiv);
                        b.h = measurePage.offsetHeight;
                    });
                };

                // Run standard layout pass first
                blocks.forEach(b => delete b.forceNewPage);
                updateBlockHeights();
                let pages = runPagination(blocks);

                // Compact layout optimizer: if content overflows to page 2, try to fit on 1 page
                if (pages.length > 1) {
                    document.body.classList.add('compact-report');
                    updateBlockHeights();
                    let compactPages = runPagination(blocks);
                    
                    if (compactPages.length === 1) {
                        // Successfully compacted into a single, clean page!
                        pages = compactPages;
                    } else {
                        // El informe requiere multipágina de forma natural.
                        document.body.classList.remove('compact-report');
                        document.body.classList.add('multipage-report');
                        updateBlockHeights();
                        pages = runPagination(blocks);

                        // MOTOR ELÁSTICO ANTI-FIRMA HUÉRFANA:
                        // Si la última página contiene ÚNICAMENTE la firma o tiene una altura de contenido <= 180px
                        const lastPage = pages[pages.length - 1];
                        const isOrphanSig = lastPage && (lastPage.currentHeight <= 180 || (lastPage.contentWrapper.children.length <= 2 && lastPage.contentWrapper.querySelector('.footer-signature')));
                        
                        if (pages.length > 1 && isOrphanSig) {
                            document.body.classList.add('compact-multipage-report');
                            updateBlockHeights();
                            let compressedPages = runPagination(blocks);

                            if (compressedPages.length < pages.length) {
                                pages = compressedPages;
                                console.log("[Layout Math Engine] Compresor anti-firma huérfana eliminó exitosamente la hoja sobrante.");
                            }
                        }
                    }
                }

                document.body.removeChild(measurePage);

                // Add footer to pages and append to canvas
                pages.forEach((page, index) => {
                    const footerHtml = `
                        <div class="page-footer">
                            <div class="page-footer-left">${code} ${nombresApellidos}</div>
                            <div class="page-footer-right"><span>página ${index + 1} de ${pages.length}</span></div>
                        </div>
                    `;
                    page.sheet.insertAdjacentHTML('beforeend', footerHtml);

                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'pv-page-wrapper';
                    pageWrapper.appendChild(page.sheet);
                    canvas.appendChild(pageWrapper);
                });

                // Generate Sidebar Thumbnails
                const sidebar = document.getElementById('pvSidebar');
                if (sidebar) {
                    sidebar.innerHTML = '<div class="pv-sidebar-header">PÁGINAS</div>';
                    pages.forEach((_, idx) => {
                        const thumb = document.createElement('div');
                        thumb.className = `pv-thumb ${idx === 0 ? 'active' : ''}`;
                        thumb.dataset.page = idx;
                        thumb.innerHTML = `
                            <div class="pv-thumb-box">
                                <div class="pv-thumb-mini-line header"></div>
                                <div class="pv-thumb-mini-line title"></div>
                                <div class="pv-thumb-mini-line"></div>
                                <div class="pv-thumb-mini-line"></div>
                            </div>
                            <span class="pv-thumb-label">Página ${idx + 1}</span>
                        `;
                        thumb.onclick = () => {
                            pages[idx].sheet.scrollIntoView({ behavior: 'smooth' });
                        };
                        sidebar.appendChild(thumb);
                    });
                }

                // Scroll listener for sidebar updates
                const scrollContainer = document.querySelector('.pv-canvas');
                if (scrollContainer) {
                    scrollContainer.onscroll = () => {
                        let activeIdx = 0;
                        let minDiff = Infinity;
                        pages.forEach((page, idx) => {
                            const rect = page.sheet.getBoundingClientRect();
                            const diff = Math.abs(rect.top - 100); 
                            if (diff < minDiff) {
                                minDiff = diff;
                                activeIdx = idx;
                            }
                        });
                        const thumbs = sidebar.querySelectorAll('.pv-thumb');
                        thumbs.forEach((t, i) => {
                            if (i === activeIdx) t.classList.add('active');
                            else t.classList.remove('active');
                        });
                    };
                }

                setTimeout(() => {
                    if (typeof window.adjustImagesAesthetics === 'function') window.adjustImagesAesthetics();
                }, 50);
            };

            // Suscribirse a cambios en tiempo real en Supabase para este paciente específico
            if (window.supabase && typeof window.SUPABASE_CONFIG !== 'undefined' && paramCodAtencion) {
                try {
                    const normCleanParam = paramCodAtencion.replace(/[-_\s]/g, '');
                    window.supabase
                        .channel(`realtime-print-${normCleanParam}`)
                        .on('postgres_changes', {
                            event: '*',
                            schema: 'public',
                            table: 'pacientes'
                        }, payload => {
                            if (payload.new) {
                                const data = payload.new;
                                const codeFromDb = String(data.cod_atencion || '').trim().toUpperCase();
                                const cleanCodeFromDb = codeFromDb.replace(/[-_\s]/g, '');
                                if (codeFromDb === paramCodAtencion || cleanCodeFromDb === normCleanParam) {
                                    console.log("[Supabase Realtime] Cambio detectado para paciente:", payload);
                                    const updatedPatient = {
                                        codAtencion: data.cod_atencion,
                                        dni: data.dni,
                                        nombres: data.nombres,
                                        apellidos: data.apellidos,
                                        paciente: data.paciente,
                                        edad: data.edad,
                                        sexo: data.sexo === 'M' ? 'MASCULINO' : (data.sexo === 'F' ? 'FEMENINO' : 'MASCULINO'),
                                        fecRegistro: data.fec_registro,
                                        fecEntrega: data.fec_entrega,
                                        medSolicitante: data.med_solicitante,
                                        especimen: data.especimen,
                                        motivoEstudio: data.motivo_estudio,
                                        macroDesc: data.macro_desc,
                                        microDesc: data.micro_desc,
                                        diagnostico: data.diagnostico,
                                        img01: data.img01,
                                        img02: data.img02,
                                        macro360: data.macro360,
                                        service: data.service
                                    };

                                    // Ocultar overlay de error o carga si estaba activo
                                    const overlay = document.getElementById('loadingOverlay');
                                    if (overlay) {
                                        overlay.style.opacity = '0';
                                        setTimeout(() => {
                                            if (overlay && overlay.parentNode) overlay.remove();
                                        }, 400);
                                    }

                                    renderPatientData(updatedPatient);
                                }
                            }
                        })
                        .subscribe();
                } catch (e) {
                    console.error("[Supabase Realtime Subscription Error]", e);
                }
            }

            if (!patient) {
                if (overlay) {
                    overlay.innerHTML = `
                        <div style="background:#fee2e2; padding:30px; border-radius:8px; border:1px solid #fecaca; text-align:center; max-width:400px; font-family:Arial,sans-serif;">
                            <h3 style="color:#b91c1c; margin-bottom:10px;">❌ Esperando Informe...</h3>
                            <p style="color:#7f1d1d; font-size:14px; margin-bottom:20px;">No se pudo encontrar datos locales para el código ${paramCodAtencion || ''}. Se ha establecido conexión en tiempo real; el informe se cargará automáticamente en cuanto sea guardado por el patólogo en el sistema.</p>
                            <div style="display:flex; justify-content:center; gap:10px;">
                                <button onclick="window.location.reload()" style="background:#2563eb; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">Reintentar carga manual</button>
                                <button onclick="window.close()" style="background:#6b7280; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Cerrar Ventana</button>
                            </div>
                        </div>
                    `;
                } else {
                    alert('No hay datos para visualizar. Esperando actualizaciones en tiempo real...');
                }
                return;
            }

            // Renderizar los datos iniciales cargados (de localStorage, Supabase o IndexedDB)
            renderPatientData(patient);

            // Ocultar cargador original
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    if (overlay && overlay.parentNode) overlay.remove();
                }, 400);
            }

            let isUserClinic = false;
            try {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUser && currentUser.perfil === 'Usuario') {
                    isUserClinic = true;
                    const btnEditar = document.querySelector('.pv-btn-secondary');
                    if (btnEditar) {
                        btnEditar.style.display = 'none';
                    }
                }
            } catch (e) {
                console.error("Error al verificar perfil de usuario en imprimir.html", e);
            }

            // Función de generación e impresión directa de PDF hoja por hoja con 100% paridad visual
            window.generatePdf = async (forceDirectDownload = isAutoDownload) => {
                let pName = patient.apellidos ? `${patient.apellidos}_${patient.nombres || ''}` : (patient.paciente || '');
                const fileNameStr = `${patient.codAtencion || ''}_${pName}`.trim().toUpperCase().replace(/\s*,\s*/g, '_').replace(/\s+/g, '_').replace(/_+/g, '_');
                document.title = fileNameStr;

                // Ajustar estética visual una última vez antes de exportar
                if (typeof window.adjustImagesAesthetics === 'function') {
                    window.adjustImagesAesthetics();
                }

                if (forceDirectDownload) {
                    const sheets = document.querySelectorAll('.pv-sheet');
                    if (sheets.length > 0) {
                        try {
                            const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jsPDF || null);

                            if (jsPDFClass && typeof window.html2canvas === 'function') {
                                const pdf = new jsPDFClass({
                                    orientation: 'portrait',
                                    unit: 'mm',
                                    format: 'a4',
                                    compress: true
                                });

                                for (let i = 0; i < sheets.length; i++) {
                                    const sheet = sheets[i];
                                    const origBoxShadow = sheet.style.boxShadow;
                                    const origTransform = sheet.style.transform;
                                    sheet.style.boxShadow = 'none';
                                    sheet.style.transform = 'none';

                                    const canvas = await window.html2canvas(sheet, {
                                        scale: 1.5,
                                        useCORS: true,
                                        logging: false,
                                        backgroundColor: '#ffffff'
                                    });

                                    sheet.style.boxShadow = origBoxShadow;
                                    sheet.style.transform = origTransform;

                                    const imgData = canvas.toDataURL('image/jpeg', 0.80);

                                    if (i > 0) {
                                        pdf.addPage('a4', 'portrait');
                                    }
                                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                                }

                                pdf.save(`${fileNameStr}.pdf`);
                                console.log("[PDF Engine] Exportación directa hoja a hoja completada con 100% paridad visual.");
                                setTimeout(() => window.close(), 1200);
                                return;
                            }
                        } catch (err) {
                            console.warn("[PDF Engine] Error en renderizado hoja por hoja, fallback a window.print()", err);
                        }
                    }
                }

                setTimeout(() => {
                    window.print();
                }, 400);
            };

            // Disparar descarga de PDF automática únicamente si isAutoDownload es true
            if (isAutoDownload) {
                const imgs = document.querySelectorAll('img');
                let loadedCount = 0;
                const totalImgs = imgs.length;
                let printTriggered = false;

                const triggerPrintOnce = () => {
                    if (printTriggered) return;
                    printTriggered = true;
                    window.generatePdf();
                };

                if (totalImgs === 0) {
                    triggerPrintOnce();
                } else {
                    const safetyTimer = setTimeout(triggerPrintOnce, 2000);
                    imgs.forEach(img => {
                        if (img.complete) {
                            loadedCount++;
                            if (loadedCount === totalImgs) {
                                clearTimeout(safetyTimer);
                                triggerPrintOnce();
                            }
                        } else {
                            const onFinish = () => {
                                loadedCount++;
                                if (loadedCount === totalImgs) {
                                    clearTimeout(safetyTimer);
                                    triggerPrintOnce();
                                }
                            };
                            img.addEventListener('load', onFinish, { once: true });
                            img.addEventListener('error', onFinish, { once: true });
                        }
                    });
                }
            }
        });
    </script>

    
</body>
