<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Traductor de Informes de Biopsia | JC PATH LAB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Re‑uso de estilos globales -->
    <link rel="stylesheet" href="client_simulator.css">
    <link rel="stylesheet" href="cortana_chat.css">
    <style>

        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;

            margin: auto;

            border: 1px solid var(--border-color);
        }
        h1 {
            margin-top: 0;

            font-size: 1.75rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: .75rem;
        }
        h2 {
            color: var(--primary);
            font-size: 1.25rem;

</head>
<body>
<div class="container">
    <h1>Traductor de Informes de Biopsia</h1>

    <!-- Entrada del informe original -->
    <div class="form-group">
        <label for="sourceText"><strong>Informe original</strong> (texto libre):</label>
        <textarea id="sourceText" placeholder="Pegue aquí el informe de biopsia anatomo-patológica..."></textarea>
    </div>

    <!-- Selección de idioma de destino -->
    <div class="form-group">
        <label for="targetLang"><strong>Idioma de salida</strong>:</label>
        <select id="targetLang">
            <option value="es">Español (original)</option>
            <option value="en">Inglés</option>
            <option value="pt">Portugués</option>
            <option value="fr">Francés</option>
        </select>
    </div>

    <!-- Botón de traducción -->
    <button id="translateBtn">Traducir Informe</button>

    <!-- Área de resultado -->
    <div id="output" aria-live="polite">Resultado de la traducción aparecerá aquí...</div>

    <!-- Historial de traducciones (SLA: 🔴 inconclusos arriba, 🟢 firmados abajo) -->
    <h2>Historial de Traducciones y SLA</h2>
    <div class="table-responsive">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Fecha‑Hora</th>
                    <th>Estado</th>
                    <th>Idioma</th>
                    <th>Resumen</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
/* -------------------------------------------------------------
   Funciones auxiliares (cero‑bloat, O(N) sobre el historial)
   ------------------------------------------------------------- */
const API_ENDPOINT = '/cortana/ask';          // FastAPI endpoint existente
const STORAGE_KEY   = 'biopsyTranslatorHistory';

/* Carga historial desde localStorage (si existe) */
function loadHistory() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    try {
        return JSON.parse(raw);
    } catch {
        // Si el JSON está corrupto, lo reiniciamos
        localStorage.removeItem(STORAGE_KEY);
        return [];
    }
}

/* Guarda historial completo en localStorage */
function saveHistory(hist) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
}

/* Añade una entrada al historial manteniendo SLA */
function addHistory(entry) {
    const hist = loadHistory();

    // Evitar duplicados por timestamp (caso de re‑intento)
    if (!hist.some(e => e.timestamp === entry.timestamp)) {
        if (entry.status === 0) {
            // inconclusos al inicio
            hist.unshift(entry);
        } else {
            // firmados al final
            hist.push(entry);
        }

        // Limitar a 200 registros
        if (hist.length > 200) hist.length = 200;
        saveHistory(hist);
        renderHistory();
    }
}

/* Actualiza una entrada existente (por timestamp) */
function updateHistory(entry) {
    const hist = loadHistory();
    const idx = hist.findIndex(e => e.timestamp === entry.timestamp);
    if (idx !== -1) {
        hist[idx] = entry;
        saveHistory(hist);
        renderHistory();
    }
}

/* Renderiza tabla respetando SLA con DocumentFragment (O(1) reflows) */
function renderHistory() {
    const tbody = document.querySelector('#historyTable tbody');
    tbody.innerHTML = '';

    const hist = loadHistory();

    const sorted = [
        ...hist.filter(e => e.status === 0),
        ...hist.filter(e => e.status === 1)
    ];

    const fragment = document.createDocumentFragment();

    for (const e of sorted) {
        const tr = document.createElement('tr');

        const tdDate = document.createElement('td');
        tdDate.textContent = new Date(e.timestamp).toLocaleString();

        const tdStatus = document.createElement('td');
        tdStatus.textContent = e.status === 1 ? '🟢 Firmado' : '🔴 Inconcluso';
        tdStatus.className = e.status === 1 ? 'green' : 'red';

        const tdLang = document.createElement('td');
        tdLang.textContent = e.lang.toUpperCase();

        const tdSummary = document.createElement('td');
        tdSummary.textContent = e.summary;

        tr.append(tdDate, tdStatus, tdLang, tdSummary);
        fragment.appendChild(tr);
    }

    tbody.appendChild(fragment);
}

/* -------------------------------------------------------------
   Lógica de traducción (fetch → FastAPI → respuesta)
   ------------------------------------------------------------- */
async function translate() {
    const sourceEl   = document.getElementById('sourceText');
    const btn        = document.getElementById('translateBtn');
    const outputEl   = document.getElementById('output');

    const source = sourceEl.value.trim();
    const target = document.getElementById('targetLang').value;

    if (!source) {
        alert('Debe ingresar el informe a traducir.');
        sourceEl.focus();
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Traduciendo...';
    outputEl.textContent = 'Procesando traducción con motor neuronal...';

    const payload = {
        prompt: `Traduce el siguiente informe de biopsia al ${target} manteniendo terminología médica exacta:\n\n${source}`
    };

    const entry = {
        timestamp: Date.now(),
        status: 0,               // provisional: inconcluso
        lang: target,
        summary: source.slice(0, 60) + (source.length > 60 ? '...' : '')
    };
    addHistory(entry);          // registra intento antes de la respuesta

    try {
        const resp = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const data = await resp.json();   // { answer: "texto traducido" }
        const translated = data.answer || 'Sin respuesta del motor.';

        outputEl.textContent = translated;

        // Actualiza historial como éxito
        entry.status = 1;
        entry.summary = translated.slice(0, 60) + (translated.length > 60 ? '...' : '');
        updateHistory(entry);
    } catch (err) {
        outputEl.textContent = `Error de conexión o motor: ${err.message}`;
        // El registro permanece como inconcluso (status 0)
    } finally {
        btn.disabled = false;
        btn.textContent = 'Traducir Informe';
    }
}

/* -------------------------------------------------------------
   Enlaces de eventos
   ------------------------------------------------------------- */
document.getElementById('translateBtn').addEventListener('click', translate);
window.addEventListener('load', renderHistory);
</script>
</body>
</html>
